# Gedosan - produzione (SPRING_PROFILES_ACTIVE=prod, secrets da GitHub Actions)

spring.application.name=Gedosan API
server.port=${SERVER_PORT}

# --- Datasource ---
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&serverTimezone=Europe/Rome
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# --- Flyway ---
#solo per lo sviluppo locale (vedi application.properties)
spring.flyway.enabled=false

# --- Mail ---
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.mittente=gedosan@vszdev.it

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=900000

# --- CORS ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# --- Jackson ---
spring.jackson.deserialize.fail-on-unknown-properties=true

# --- Regole di business ---
prenotazioni.orizzonte-giorni=60
prenotazioni.eta-minima=18
prenotazioni.intervallo-uomini-giorni=90
prenotazioni.intervallo-donne-giorni=365
prenotazioni.distanza-minima-donne-giorni=90
prenotazioni.posti-per-slot=2

# --- Logging ---
logging.level.root=WARN
logging.level.it.vszdev.gedosanapi=INFO
logging.level.org.hibernate.SQL=WARN
logging.file.name=logs/app.log
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

# --- Actuator ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never