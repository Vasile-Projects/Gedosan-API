# Gedosan - dev locale

spring.application.name=Gedosan API
server.port=8080

# --- Datasource ---
spring.datasource.url=jdbc:mysql://localhost:3306/donazioni_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Europe/Rome
spring.datasource.username=${DB_USERNAME:gedosan}
spring.datasource.password=${DB_PASSWORD:gedosan_dev}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# READ COMMITTED invece del REPEATABLE READ di default di MySQL. Con REPEATABLE READ le letture normali
# (i COUNT di ricalcolaPostiOccupati, i controlli su intervallo e limite annuo) usano la "fotografia"
# scattata alla prima lettura della transazione, PRIMA dei lock pessimistici: due richieste
# concorrenti sull'ultimo posto passavano entrambe. Con READ COMMITTED ogni istruzione vede i dati
# confermati in quel momento, quindi dopo aver ottenuto il lock i conteggi sono aggiornati.
spring.datasource.hikari.transaction-isolation=TRANSACTION_READ_COMMITTED

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Flyway ---
# In locale carica anche i dati demo (db/demo); in prod solo lo schema (db/migration)
spring.flyway.locations=classpath:db/migration,classpath:db/demo
# DB gia' esistente (creato prima di Flyway): fa da baseline a V1 invece di rieseguirlo
spring.flyway.baseline-on-migrate=true

# --- Mail ---
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.mittente=gedosan@vszdev.it

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=900000

# --- CORS ---
cors.allowed-origins=http://localhost:4200,http://localhost:4300

# --- Jackson ---
spring.jackson.deserialization.fail-on-unknown-properties=true

# --- Regole di business ---
prenotazioni.orizzonte-giorni=365
prenotazioni.eta-minima=18
prenotazioni.eta-massima=65
prenotazioni.intervallo-uomini-giorni=90
prenotazioni.distanza-minima-donne-giorni=90
prenotazioni.finestra-limite-donne-giorni=365
prenotazioni.max-donazioni-donne-per-finestra=2
# NB: allineato al vincolo DB chk_slot_posti (slot_giornalieri: posti_occupati BETWEEN 0 AND 2).
# Per cambiare questo valore serve una migrazione Flyway che aggiorni anche quel CHECK.
prenotazioni.posti-per-slot=2
prenotazioni.anticipo-minimo-minuti=90
prenotazioni.minuti-attesa-conferma=30

# --- Conferma via email ---
# Base del link di conferma: la pagina del frontend che mostra il pulsante e fa la POST.
app.frontend-url=http://localhost:4200

# --- Cloudflare Turnstile ---
# Disattivato in locale. Per provarlo: enabled=true con la secret di test che passa sempre
# (1x0000000000000000000000000000000AA) e la site key di test nel frontend.
turnstile.enabled=false
turnstile.secret=${TURNSTILE_SECRET:}

# --- Logging ---
logging.level.root=WARN
logging.level.it.vszdev.gedosanapi=DEBUG
logging.level.org.hibernate.SQL=WARN
logging.file.name=logs/app.log
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB

# --- Actuator ---
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always