

services:
  api:
    build: .
    image: gedosan-api:latest
    container_name: gedosan-api
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      DB_HOST: gedosan-db
      DB_PORT: 3306
      DB_NAME: donazioni_db
      DB_USERNAME: ${DB_USERNAME:?serve il secret DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD:?serve il secret DB_PASSWORD}
      MAIL_USERNAME: ${MAIL_USERNAME:?serve il secret MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD:?serve il secret MAIL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?serve il secret JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?serve il secret CORS_ALLOWED_ORIGINS}
    networks:
      - gedosan-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

networks:
  gedosan-net:
    external: true
